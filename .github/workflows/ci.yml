name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  # The release builds are heavy and only needed for a release, so they run on
  # request (the "Run workflow" button) and upload the folders as artifacts. The
  # Windows job is the same native build build_windows.ps1 performs. The Linux
  # job freezes on the runner's own glibc, which is newer than the Debian 12 base
  # build_linux.sh uses; for a Linux release that runs on older distributions,
  # build with build_linux.sh.
  build:
    name: Release build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --distpath release mapgen_portable.spec
          cp README.md release/MapGen-Portable-Linux-x86_64/README.txt
          cp LICENSE release/MapGen-Portable-Linux-x86_64/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md release/MapGen-Portable-Linux-x86_64/THIRD-PARTY-NOTICES.txt
          cp assets/mapgen.svg assets/mapgen.desktop release/MapGen-Portable-Linux-x86_64/
          mkdir -p release/MapGen-Portable-Linux-x86_64/output
      - name: Smoke test the frozen app (headless preview)
        shell: bash
        run: |
          cd release/MapGen-Portable-*-x86_64
          ./MapGen* --headless-preview preview.png --seed 7
          test -s preview.png && rm preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: MapGen-Portable-${{ runner.os }}-x86_64
          path: release/MapGen-Portable-*-x86_64/
